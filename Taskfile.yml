# Taskfile — https://taskfile.dev
# Targets: db, db:verbs, db:dictionary, test, swagger, build, run

version: "3"

vars:
  # Prefer the project virtualenv so `task` works from a shell that has not
  # activated it. Bare `python3` may resolve to an interpreter without the
  # dependencies (e.g. a pyenv/system python), which fails confusingly in the
  # test task. Falls back to `python3` when there is no local venv.
  PYTHON:
    sh: if [ -x .venv/bin/python ]; then echo .venv/bin/python; else echo python3; fi

tasks:
  db:
    desc: Build all local SQLite databases (verbs.db + dictionary.db)
    deps: [db:verbs, db:dictionary]

  db:verbs:
    desc: Build the conjugation database (verbs.db) from the Kaikki Italian dump
    cmds:
      - "{{.PYTHON}} build_db.py"
    sources:
      - build_db.py
    generates:
      - data/verbs.db

  db:dictionary:
    desc: Build the full dictionary database (dictionary.db) from the Kaikki Italian dump
    cmds:
      - "{{.PYTHON}} build_dictionary_db.py"
    sources:
      - build_dictionary_db.py
    generates:
      - data/dictionary.db

  test:
    desc: Run the regression test suite (stdlib unittest)
    deps: [db]
    cmds:
      - "{{.PYTHON}} -m unittest discover -s tests -v"

  swagger:
    desc: Regenerate swagger.json (the OpenAPI contract) from the FastAPI app
    cmds:
      - "{{.PYTHON}} dump_openapi.py"
    sources:
      - app/api.py
      - app/models.py
      - dump_openapi.py
    generates:
      - swagger.json

  build:
    desc: Build the Docker image (it-conjugator-api); requires the databases
    deps: [db]
    cmds:
      - docker build -t it-conjugator-api .

  run:
    desc: Build and (re)start the API via docker compose
    deps: [db, build]
    cmds:
      - docker compose up --build -d
